hotel:
  nombre: Aura
  lema: Hotel Boutique & Casa de Mar
  ciudad: Costa Norte, Caribe
  zona_horaria: America/Puerto_Rico
  moneda: USD
  telefono: "+00 000 000 000"
  correo: hola@aura.example
  direccion: "Calle del Faro 12, Costa Norte, Caribe"
  # Paleta de Aura: marfil, carbón marino, arena, terracota, verde bruma
  colores: { primario: "#16202B", oscuro: "#16202B", arena: "#E6D8C0", acento: "#B8623F", fondo: "#F6F0E4", bruma: "#5E7468", cal: "#FBF8F1" }
  foto_portada: "/aura/uploads/images/portada.jpg"
agente:
  nombre: Nía
  tono: cálida, elegante y concisa; trata de tú y habla como la concierge de una casa pequeña que conoce a cada huésped
  idiomas: [es, en]
habitaciones:
  # Los códigos son internos (no cambiar sin actualizar pruebas); los nombres son los de Aura.
  - { codigo: STD_CITY, nombre_es: Habitación Deluxe, nombre_en: Deluxe Room, max_huespedes: 2, inventario: 12, foto: "/aura/uploads/images/hab-deluxe-desayuno.jpg", descripcion_es: "Muros encalados, cama king y terraza privada con sombra. 38 m².", descripcion_en: "Whitewashed walls, king bed and a shaded private terrace. 38 m².", amenidades_es: "Terraza · Ducha lluvia · Espresso", amenidades_en: "Terrace · Rain shower · Espresso" }
  - { codigo: DLX_SEA, nombre_es: Habitación Vista al Mar, nombre_en: Sea View Room, max_huespedes: 4, inventario: 10, foto: "/aura/uploads/images/hab-vista-mar-balcon.jpg", descripcion_es: "Balcón orientado al oeste sobre la bahía, hecho para atardeceres. 46 m².", descripcion_en: "West-facing balcony over the bay, made for sunsets. 46 m².", amenidades_es: "Vista al mar · Tina · Balcón", amenidades_en: "Sea view · Bathtub · Balcony" }
  - { codigo: STE_TER, nombre_es: Suite Vista al Mar, nombre_en: Sea View Suite, max_huespedes: 4, inventario: 2, foto: "/aura/uploads/images/hab-suite-tina.jpg", descripcion_es: "Sala independiente, terraza envolvente y piscina privada. 78 m².", descripcion_en: "Separate living room, wraparound terrace and private pool. 78 m².", amenidades_es: "Piscina privada · Sala · Mayordomo", amenidades_en: "Private pool · Living room · Butler" }
tarifas:
  - codigo: FLEX
    nombre: Flexible (pagas en el hotel)
    nombre_en: Flexible (pay at the hotel)
    modalidad_pago: pay_at_hotel
    garantia_usd: 100
    cancelacion: Gratis hasta 48 h antes; después se cobra la primera noche.
    cancelacion_en: Free until 48 h before arrival; after that the first night is charged.
    precio_noche_usd: { STD_CITY: 289, DLX_SEA: 389, STE_TER: 569 }
  - codigo: PREPAGO
    nombre: Prepago (−12%)
    nombre_en: Prepaid (−12%)
    modalidad_pago: prepaid
    descuento_pct: 12
    cancelacion: No reembolsable.
    cancelacion_en: Non-refundable.
impuestos:
  - { nombre: "Impuesto de habitación (tasa de prueba)", nombre_en: "Room tax (test rate)", sobre: habitacion, tasa_pct: 9 } # tasa de prueba, no real
politicas:
  check_in: "15:00"
  check_out: "12:00"
  mascotas: Perros de hasta 10 kg, USD 25 por noche.
  mascotas_en: Dogs up to 10 kg, USD 25 per night.
  cargo_mascota_usd: 25
  peso_max_mascota_kg: 10
servicios:
  # duracion_min: para la invitación de calendario del correo. sugerir: false = no aparece en "también te puede gustar" de los correos.
  - { codigo: REST, nombre: Brasa · mesa junto al agua, nombre_en: Brasa · table by the water, horario: "18:30-22:30", duracion_min: 120, descripcion: "Sal, humo y cítricos en la terraza. Desayuno hasta el mediodía, cena junto al agua. Reservar la mesa no tiene costo.", foto: "/aura/uploads/images/restaurante-brasa.jpg" }
  - { codigo: SAIL, nombre: Navegación al atardecer, nombre_en: Sunset sail, horario: "17:15", precio_usd: 140, duracion_min: 120, descripcion: "Dos horas en velero con capitán, champaña y bocados del mar. Hasta 6 personas.", foto: "/aura/uploads/images/navegacion-atardecer.jpg" }
  - { codigo: SAND, nombre: Cena en la arena, nombre_en: Dinner on the sand, horario: "18:00", precio_usd: 220, duracion_min: 150, descripcion: "Mesa privada en la playa con farol y maridaje: tres tiempos de Brasa para dos.", foto: "/aura/uploads/images/cena-arena.jpg" }
  - { codigo: BAR, nombre: Cóctel en la terraza, nombre_en: Terrace cocktail, horario: "17:30-19:00", precio_usd: 45, duracion_min: 90, sugerir: false, descripcion: "Dos cócteles de autor con ron local y bocados, mirando la puesta de sol.", foto: "/aura/uploads/images/terraza-frente-mar.jpg" }
  - { codigo: SPA, nombre: Ritual de bienestar, nombre_en: Wellness ritual, horario: "09:00-19:00", precio_usd: 120, duracion_min: 60, sugerir: false, descripcion: "Tratamiento de 60 minutos al aire libre, con aceites locales.", foto: "/aura/uploads/images/spa-bienestar.jpg" }
  - { codigo: PIEDRAS, nombre: Piedras calientes, nombre_en: Hot stones, horario: "09:00-19:00", precio_usd: 120, duracion_min: 75, sugerir: false, descripcion: "Piedras volcánicas tibias, aceite de coco y orquídea.", foto: "/aura/uploads/images/ritual-piedras.jpg" }
  - { codigo: MASAJE, nombre: Masaje en sala abierta, nombre_en: Open-air massage, horario: "09:00-19:00", precio_usd: 150, duracion_min: 90, sugerir: false, descripcion: "Masaje profundo en una sala de madera abierta al verde.", foto: "/aura/uploads/images/ritual-masaje.jpg" }
  - { codigo: TINA, nombre: Baño de flores y cítricos, nombre_en: Flower & citrus bath, horario: "09:00-21:00", precio_usd: 80, duracion_min: 45, sugerir: false, descripcion: "Tina preparada en tu habitación con flores, limón y una copa de vino blanco.", foto: "/aura/uploads/images/ritual-tina.jpg" }
  - { codigo: YOGA, nombre: Yoga al amanecer, nombre_en: Sunrise yoga, horario: "06:30", precio_usd: 40, duracion_min: 60, sugerir: false, descripcion: "Práctica guiada frente al mar con la primera luz. Esteras y agua de coco incluidas.", foto: "/aura/uploads/images/ritual-yoga.jpg" }
  - { codigo: TRAS, nombre: Traslado desde el aeropuerto, nombre_en: Airport transfer, precio_usd: 45, duracion_min: 30, descripcion: "Auto privado; el aeropuerto está a veinte minutos.", foto: "/aura/uploads/images/traslado-aeropuerto.jpg" }
recordatorios:
  precheckin_horas_antes: 24
  aviso_checkout_hora: "08:00"
